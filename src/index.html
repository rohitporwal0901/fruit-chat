<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FruitChat - Fresh Fruits & Healthy Sprouts</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FruitChat - Order fresh fruit chaat, masala sprouts, and healthy juices. Fast delivery, pure freshness.">
  <meta name="theme-color" content="#2E7D32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    // Prevent double-click and double-tap zoom on mobile devices
    document.addEventListener('dblclick', function (e) {
      e.preventDefault();
    }, { passive: false });

    let lastTouchTime = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - lastTouchTime <= 320) {
        const isInteractive = e.target && e.target.closest && e.target.closest('button, a, input, textarea, select, .qty-btn, .step-btn');
        if (!isInteractive) {
          e.preventDefault();
        }
      }
      lastTouchTime = now;
    }, { passive: false });
  </script>
</body>
</html>
