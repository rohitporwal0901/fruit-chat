<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Deep Emerald Crest Gradient -->
    <linearGradient id="fcCrestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#144A1B"/>
      <stop offset="100%" stop-color="#082811"/>
    </linearGradient>

    <!-- Gold Border Shimmer -->
    <linearGradient id="fcGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D776"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#99771A"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle / Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fcCrestGrad)" filter="url(#crestShadow)"/>
  
  <!-- Premium Gold Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#fcGoldGrad)" stroke-width="2"/>
  
  <!-- Inner Golden Dotted Accent Circle -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.75"/>

  <!-- Golden Crown / Fruit Leaf at Top -->
  <path d="M32 15 C34.5 11.5, 39 12, 40 14.5 C40 17.5, 36.5 19.5, 32 18" stroke="url(#fcGoldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="14.5" r="2.2" fill="#F9D776"/>

  <!-- Bold Crisp FC Monogram -->
  <text x="32" y="41" text-anchor="middle" font-family="'Outfit', 'Playfair Display', Georgia, serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="1">FC</text>

  <!-- Small sparkling star / fruit seed at bottom -->
  <circle cx="32" cy="47.5" r="1.5" fill="#D4AF37"/>
</svg>
